name: asc-check (SDK API discovery)
# Branch-only replacement: prints Screen Time framework declarations from the iOS SDK. No secrets used.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  grep:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Grep ManagedSettings / FamilyControls / DeviceActivity interfaces
        run: |
          set -uo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version | head -2
          SDK=$(xcrun --sdk iphoneos --show-sdk-path); echo "SDK $(xcrun --sdk iphoneos --show-sdk-version) $SDK"
          MS=$(find "$SDK/System/Library/Frameworks/ManagedSettings.framework" -name 'arm64e-apple-ios.swiftinterface' | head -1)
          echo "=== ManagedSettings 400-500"; sed -n 400,500p "$MS"
          echo "=== Expir across Screen Time frameworks"
          grep -rn -i 'expir' "$SDK/System/Library/Frameworks/ManagedSettings.framework" "$SDK/System/Library/Frameworks/FamilyControls.framework" "$SDK/System/Library/Frameworks/DeviceActivity.framework" "$SDK/System/Library/Frameworks/ManagedSettingsUI.framework" 2>/dev/null | grep -v '\.tbd' | head -60 || true
          echo "=== done"; true
