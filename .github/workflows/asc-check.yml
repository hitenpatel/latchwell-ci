name: asc-check (read-only, fetch existing Latchwell dev profiles)
# Read-only: lists the Latchwell bundle IDs and their capabilities via the App Store Connect API.
# Prints only identifiers and capability type names (no keys, ids or tokens).
on: workflow_dispatch
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List bundle IDs and capabilities
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          pip install -q pyjwt cryptography >/dev/null 2>&1
          mkdir -p "$RUNNER_TEMP/profiles"
          python3 - <<'PYX'
          import base64, hashlib, json, os, plistlib, re, time, urllib.request, jwt
          key = base64.b64decode(os.environ["ASC_KEY_B64"]).decode()
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def get(url):
              r = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"})
              with urllib.request.urlopen(r, timeout=60) as resp: return json.load(resp)
          # GET only: lists existing development profiles; creates, edits and deletes nothing.
          url = "https://api.appstoreconnect.apple.com/v1/profiles?limit=200"
          want = {"app.latchwell.ios", "app.latchwell.ios.monitor", "app.latchwell.ios.shieldconfig", "app.latchwell.ios.shieldaction"}
          out = os.path.join(os.environ["RUNNER_TEMP"], "profiles"); n = 0
          while url:
              d = get(url)
              print("page", len(d["data"]), [(x["attributes"]["name"], x["attributes"]["profileType"], x["attributes"]["profileState"]) for x in d["data"]])
              for p in d["data"]:
                  raw = base64.b64decode(p["attributes"]["profileContent"])
                  m = re.search(rb"<\?xml.*?</plist>", raw, re.S)
                  if not m: print("no plist in", p["attributes"]["name"]); continue
                  pl = plistlib.loads(m.group(0))
                  appid = pl["Entitlements"].get("application-identifier", "")
                  bid = appid.split(".", 1)[1] if "." in appid else ""
                  shas = [hashlib.sha1(c).hexdigest().upper()[:8] for c in pl.get("DeveloperCertificates", [])]
                  dev = "00008030-0008553A1A79402E" in pl.get("ProvisionedDevices", [])
                  fc = bool(pl["Entitlements"].get("com.apple.developer.family-controls"))
                  print(bid or appid, p["attributes"]["name"], str(pl["ExpirationDate"])[:10], "mac7349:", "7349C809" in shas, "device:", dev, "familyControls:", fc)
                  if bid in want and "7349C809" in shas and dev and fc:
                      open(os.path.join(out, f"{bid}--{pl['UUID']}.mobileprovision"), "wb").write(raw); n += 1
              url = d.get("links", {}).get("next")
          print("saved", n)
          PYX
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b
        with: { name: latchwell-dev-profiles, path: "${{ runner.temp }}/profiles", retention-days: 1, if-no-files-found: error }
