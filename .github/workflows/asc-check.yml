name: asc-check
# Read-only: lists the Latchwell bundle IDs and their capabilities via the App Store Connect API.
# Prints only identifiers and capability type names (no keys, ids or tokens).
on: workflow_dispatch
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List bundle IDs and capabilities
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          pip install -q pyjwt cryptography >/dev/null 2>&1
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, jwt
          key = base64.b64decode(os.environ["ASC_KEY_B64"]).decode()
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def get(url):
              r = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"})
              return json.load(urllib.request.urlopen(r))
          want = ["app.latchwell.ios", "app.latchwell.ios.monitor", "app.latchwell.ios.shieldconfig", "app.latchwell.ios.shieldaction"]
          d = get("https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=" + ",".join(want) + "&include=bundleIdCapabilities&limit=50")
          caps = {c["id"]: c["attributes"].get("capabilityType") for c in d.get("included", []) if c["type"] == "bundleIdCapabilities"}
          found = {}
          for b in d["data"]:
              ident = b["attributes"]["identifier"]
              if ident not in want: continue
              ids = [x["id"] for x in b["relationships"]["bundleIdCapabilities"]["data"]]
              found[ident] = sorted(caps.get(i, "?") for i in ids)
          for w in want:
              print(f"{w}: " + (", ".join(found[w]) if w in found else "MISSING"))
          PY
