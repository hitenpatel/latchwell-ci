name: asc-check (SDK API discovery)
# Branch-only replacement: prints Screen Time framework declarations from the iOS SDK. No secrets used.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  grep:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Grep ManagedSettings / FamilyControls / DeviceActivity interfaces
        run: |
          set -uo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version | head -2
          SDK=$(xcrun --sdk iphoneos --show-sdk-path); echo "SDK $(xcrun --sdk iphoneos --show-sdk-version) $SDK"
          for fw in ManagedSettings FamilyControls DeviceActivity; do
            for f in $(find "$SDK/System/Library/Frameworks/$fw.framework" -name '*.swiftinterface' | grep -i 'arm64-apple-ios.swiftinterface$\|arm64e-apple-ios.swiftinterface$' | head -1); do
              echo "=== $fw: $f"
              grep -n -i -B3 -A6 'expir\|func refresh\|TokenRefresh\|invalidat' "$f" | head -200
            done
          done
