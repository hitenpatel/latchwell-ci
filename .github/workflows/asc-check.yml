name: asc-check
# Read-only: lists the Latchwell app record, subscriptions and in-app purchases via the App Store Connect API.
# Prints only product identifiers, states, prices and locales (no keys or tokens).
on: workflow_dispatch
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List bundle IDs and capabilities
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          pip install -q pyjwt cryptography >/dev/null 2>&1
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error, jwt
          key = base64.b64decode(os.environ["ASC_KEY_B64"]).decode()
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          B = "https://api.appstoreconnect.apple.com"
          def get(path):
              r = urllib.request.Request(B + path, headers={"Authorization": f"Bearer {tok}"})
              return json.load(urllib.request.urlopen(r))
          def opt(path):
              try:
                  d = get(path)
                  return d if d.get("data") else None
              except urllib.error.HTTPError as e:
                  if e.code == 404: return None
                  raise
          def price_rows(d, point_type):
              pts = {x["id"]: x["attributes"].get("customerPrice") for x in d.get("included", []) if x["type"] == point_type}
              rel = "subscriptionPricePoint" if point_type == "subscriptionPricePoints" else "inAppPurchasePricePoint"
              out = {}
              for pr in d["data"]:
                  t = pr["relationships"]["territory"]["data"]["id"]
                  if t in ("GBR", "USA"): out[t] = pts.get(pr["relationships"][rel]["data"]["id"])
              return out
          try:
              st = get("/v2/sandboxTesters?limit=50")["data"]
              print("sandbox testers:", len(st), [t["attributes"].get("territory") for t in st])
          except Exception as e:
              print("sandbox testers lookup failed", e)
          app = get("/v1/apps?filter[bundleId]=app.latchwell.ios")["data"]
          print("app record:", "FOUND " + app[0]["attributes"]["name"] if app else "MISSING")
          if app:
              aid = app[0]["id"]
              for g in get(f"/v1/apps/{aid}/subscriptionGroups?limit=50")["data"]:
                  gl = get(f"/v1/subscriptionGroups/{g['id']}/subscriptionGroupLocalizations")["data"]
                  print("group:", g["attributes"]["referenceName"], "localizations:", sorted(l["attributes"]["locale"] for l in gl))
                  for sub in get(f"/v1/subscriptionGroups/{g['id']}/subscriptions?limit=50")["data"]:
                      a = sub["attributes"]
                      print("  sub:", a["productId"], a.get("subscriptionPeriod"), a.get("state"), "level", a.get("groupLevel"))
                      offers = get(f"/v1/subscriptions/{sub['id']}/introductoryOffers?limit=200")["data"]
                      print("    intro offers:", len(offers), sorted({(o["attributes"].get("offerMode"), o["attributes"].get("duration")) for o in offers}))
                      print("    prices:", price_rows(get(f"/v1/subscriptions/{sub['id']}/prices?include=subscriptionPricePoint,territory&limit=200"), "subscriptionPricePoints"))
                      print("    localizations:", sorted(l["attributes"]["locale"] for l in get(f"/v1/subscriptions/{sub['id']}/subscriptionLocalizations")["data"]))
                      print("    review screenshot:", bool(opt(f"/v1/subscriptions/{sub['id']}/appStoreReviewScreenshot")))
                      av = opt(f"/v1/subscriptions/{sub['id']}/subscriptionAvailability?include=availableTerritories")
                      print("    availability set:", bool(av), "territories:", len((av or {}).get("included", [])))
              for i in get(f"/v1/apps/{aid}/inAppPurchasesV2?limit=50")["data"]:
                  a = i["attributes"]
                  print("iap:", a["productId"], a.get("inAppPurchaseType"), a.get("state"))
                  sch = opt(f"/v1/inAppPurchasePriceSchedules/{i['id']}/manualPrices?include=inAppPurchasePricePoint,territory&limit=200")
                  print("    prices:", price_rows(sch, "inAppPurchasePricePoints") if sch else "none")
                  print("    localizations:", sorted(l["attributes"]["locale"] for l in get(f"/v2/inAppPurchases/{i['id']}/inAppPurchaseLocalizations")["data"]))
                  print("    review screenshot:", bool(opt(f"/v2/inAppPurchases/{i['id']}/appStoreReviewScreenshot")))
                  av = opt(f"/v2/inAppPurchases/{i['id']}/inAppPurchaseAvailability?include=availableTerritories")
                  print("    availability set:", bool(av), "territories:", len((av or {}).get("included", [])))
          PY
