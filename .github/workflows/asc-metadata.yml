name: asc-metadata
# Reports the App Store metadata of the pre-release version; with apply, sets it from
# docs/release/app-store-metadata.json in the app repo. Never submits for review, never changes price or availability.
on:
  workflow_dispatch:
    inputs:
      sha: { description: "Forgejo commit holding the metadata", required: true }
      apply: { description: "write the metadata (default: report only)", type: boolean, default: false }
permissions: { contents: read }
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: ci, sparse-checkout: .github/scripts, sparse-checkout-cone-mode: false, persist-credentials: false }
      - name: Clone source at sha
        env: { HOST: "${{ secrets.FORGEJO_HOST }}", TOKEN: "${{ secrets.FORGEJO_CLONE_TOKEN }}", SHA: "${{ inputs.sha }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 hex chars"; exit 1; }
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64); echo "::add-mask::$AUTH"; echo "::add-mask::$HOST"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" clone -q --branch main "https://${HOST}/hiten/latchwell.git" src 2>/dev/null || { echo "::error::clone failed"; exit 1; }
          git -C src checkout -q "$SHA" || { echo "::error::checkout failed"; exit 1; }
      - name: Report or apply metadata
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
          APPLY: "${{ inputs.apply && '1' || '0' }}"
        run: |
          set -euo pipefail
          pip install -q pyjwt cryptography >/dev/null 2>&1
          F=src/docs/release/app-store-metadata.json; [ -f "$F" ] || F=""
          python3 "$GITHUB_WORKSPACE/ci/.github/scripts/asc_metadata.py" $F
