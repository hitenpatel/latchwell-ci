name: asc-screenshots
# Uploads the App Store screenshots committed in the app repo (docs/release/app-store-screenshots/6.9) to the
# editable App Store version, replacing the 6.9-inch set in every localization. dry_run only reports.
on:
  workflow_dispatch:
    inputs:
      sha: { description: "Forgejo commit holding the screenshots", required: true }
      dry_run: { description: "report only", type: boolean, default: true }
permissions: { contents: read }
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: ci, sparse-checkout: .github/scripts, sparse-checkout-cone-mode: false, persist-credentials: false }
      - name: Clone source at sha
        env: { HOST: "${{ secrets.FORGEJO_HOST }}", TOKEN: "${{ secrets.FORGEJO_CLONE_TOKEN }}", SHA: "${{ inputs.sha }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 hex chars"; exit 1; }
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64); echo "::add-mask::$AUTH"; echo "::add-mask::$HOST"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" clone -q --branch main "https://${HOST}/hiten/latchwell.git" src 2>/dev/null || { echo "::error::clone failed"; exit 1; }
          git -C src checkout -q "$SHA" || { echo "::error::checkout failed"; exit 1; }
      - name: Upload screenshots
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
          DRY_RUN: "${{ inputs.dry_run && '1' || '0' }}"
        run: |
          set -euo pipefail
          pip install -q pyjwt cryptography >/dev/null 2>&1
          python3 "$GITHUB_WORKSPACE/ci/.github/scripts/asc_screenshots.py" src/docs/release/app-store-screenshots/6.9
