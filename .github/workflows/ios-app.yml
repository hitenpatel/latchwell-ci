name: ios-app (unsigned device build)
on:
  workflow_dispatch:
    inputs:
      sha: {description: Forgejo commit, required: true}
      branch: {description: Forgejo source branch, required: true}
      maestro: {description: unused, type: boolean, default: false}
      ipa: {description: encrypted unsigned device IPA, type: boolean, default: true}
permissions: {contents: read}
jobs:
  unsigned-device:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Clone exact source
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64)
          echo "::add-mask::$AUTH"; echo "::add-mask::$HOST"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" clone -q --branch "$BRANCH" "https://${HOST}/hiten/latchwell.git" src 2>/dev/null
          git -C src checkout -q "$SHA"
          test "$(git -C src rev-parse HEAD)" = "$SHA"
      - name: Toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version | head -1
          brew install xcodegen >/dev/null 2>&1 || true
          cd src/ios/App
          xcodegen generate > "$RUNNER_TEMP/xcodegen.log" 2>&1
      - name: Archive without signing and encrypt
        env:
          IPA_PASSPHRASE: ${{ secrets.SPIKE_IPA_PASSPHRASE }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          cd src/ios/App
          if ! xcodebuild archive -project Latchwell.xcodeproj -scheme Latchwell -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Unsigned.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_STYLE=Manual > "$RUNNER_TEMP/unsigned.log" 2>&1; then
            grep -E 'error:' "$RUNNER_TEMP/unsigned.log" | head -20 || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$RUNNER_TEMP/Unsigned.xcarchive/Products/Applications/Latchwell.app" "$RUNNER_TEMP/package/Payload/Latchwell.app"
          printf '{"sourceSHA":"%s","signing":"unsigned","runID":"%s"}\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/package/build-provenance.json"
          cd "$RUNNER_TEMP/package"
          zip -qry "$RUNNER_TEMP/Latchwell-unsigned.ipa" Payload build-provenance.json
          IPA_PASS="$(printf '%s' "$IPA_PASSPHRASE" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          test -n "$IPA_PASS" || { echo "::error::IPA encryption passphrase is empty"; exit 1; }
          export IPA_PASS
          /usr/bin/openssl enc -aes-256-cbc -pbkdf2 -md sha256 -iter 600000 -salt -in "$RUNNER_TEMP/Latchwell-unsigned.ipa" -out "$RUNNER_TEMP/Latchwell-unsigned.ipa.enc" -pass env:IPA_PASS
          /usr/bin/openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -iter 600000 -in "$RUNNER_TEMP/Latchwell-unsigned.ipa.enc" -out "$RUNNER_TEMP/roundtrip.ipa" -pass env:IPA_PASS
          cmp -s "$RUNNER_TEMP/Latchwell-unsigned.ipa" "$RUNNER_TEMP/roundtrip.ipa"
          echo 'Unsigned device archive and encryption round-trip passed; no certificate API or signing performed.'
      - name: Cleanup plaintext archive
        if: always()
        run: rm -rf "$RUNNER_TEMP/Unsigned.xcarchive" "$RUNNER_TEMP/package" "$RUNNER_TEMP/Latchwell-unsigned.ipa" "$RUNNER_TEMP/roundtrip.ipa" "$RUNNER_TEMP/unsigned.log" "$RUNNER_TEMP/xcodegen.log"
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b
        with:
          name: Latchwell-unsigned-ipa-enc
          path: ${{ runner.temp }}/Latchwell-unsigned.ipa.enc
          retention-days: 3
          if-no-files-found: error
