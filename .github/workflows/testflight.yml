name: testflight
# Archives Latchwell with cloud-managed distribution signing and uploads it to App Store Connect for TestFlight.
# Needs the owner's go-ahead (a distribution certificate is created on first use) and the Family Controls
# distribution entitlement on all four bundle ids. Not run until both are confirmed.
on:
  workflow_dispatch:
    inputs:
      sha: { description: "Forgejo commit on main", required: true }
      confirm: { description: "type UPLOAD to confirm", required: true }
permissions: { contents: read }
concurrency: { group: testflight, cancel-in-progress: false }
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # A guard against accidental dispatch only; the owner's approval is a procedural step (manual steps), not enforced here.
      - name: Confirm
        env: { CONFIRM: "${{ inputs.confirm }}" }
        run: '[ "$CONFIRM" = UPLOAD ] || { echo "::error::type UPLOAD to confirm"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: ci, sparse-checkout: .github/scripts, sparse-checkout-cone-mode: false, persist-credentials: false }
      - name: Clone source at sha
        env: { HOST: "${{ secrets.FORGEJO_HOST }}", TOKEN: "${{ secrets.FORGEJO_CLONE_TOKEN }}", SHA: "${{ inputs.sha }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 hex chars"; exit 1; }
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64); echo "::add-mask::$AUTH"; echo "::add-mask::$HOST"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" clone -q --branch main "https://${HOST}/hiten/latchwell.git" src 2>/dev/null || { echo "::error::clone failed"; exit 1; }
          git -C src checkout -q "$SHA" || { echo "::error::checkout failed"; exit 1; }
      # Before anything from the source tree runs (xcodegen in Toolchain can run project hooks).
      - name: Commit is on main
        env: { SHA: "${{ inputs.sha }}" }
        run: |
          set -euo pipefail
          git -C src fetch -q --unshallow origin main 2>/dev/null || git -C src fetch -q origin main 2>/dev/null || true
          git -C src merge-base --is-ancestor "$SHA" origin/main || { echo "::error::commit is not on main"; exit 1; }
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"; xcodebuild -version | head -1
          brew install xcodegen >/dev/null 2>&1 || true
          cd src/ios/App && xcodegen generate > "$RUNNER_TEMP/xcodegen.log" 2>&1 || { tail -20 "$RUNNER_TEMP/xcodegen.log"; exit 1; }
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/asc.p8"; echo "$ASC_KEY_B64" | base64 --decode > "$KEY"
          sanitize() { sed -E 's#/Users/runner/[^ ]*##g; s#src/[^ :]*##g' | grep -E "error:" | head -20 || true; }
          cd src/ios/App
          xcodegen generate >/dev/null
          sed "s/TEAMID/$APPLE_TEAM_ID/" "$GITHUB_WORKSPACE/ci/.github/scripts/export-appstore.plist" > "$RUNNER_TEMP/export.plist"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Unique per run and per rerun; applied to the app and every extension by the command-line override.
          BUILD="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          xcodebuild archive -project Latchwell.xcodeproj -scheme Latchwell -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" "${AUTH[@]}" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { echo "archive failed:"; sanitize < "$RUNNER_TEMP/archive.log"; exit 1; }
          for p in "$RUNNER_TEMP"/App.xcarchive/Products/Applications/Latchwell.app/Info.plist "$RUNNER_TEMP"/App.xcarchive/Products/Applications/Latchwell.app/PlugIns/*.appex/Info.plist; do
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$p"); [ "$v" = "$BUILD" ] || { echo "::error::$(basename "$(dirname "$p")") has build $v, want $BUILD"; exit 1; }
          done
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/out" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" "${AUTH[@]}" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { echo "upload failed:"; sanitize < "$RUNNER_TEMP/export.log"; exit 1; }
          echo "uploaded build $BUILD"
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"; rm -rf "$RUNNER_TEMP/out" "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP"/*.log
